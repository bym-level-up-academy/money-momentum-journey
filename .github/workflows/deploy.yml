name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Construire le site statique
        env:
          GH_PAGES_BASE: ${{ vars.GH_PAGES_BASE || '/' }}
        run: bun run build

      - name: Préparer les fichiers pour GitHub Pages
        run: |
          OUT_DIR=$([ -d ".output/public" ] && echo ".output/public" || echo "dist/client")
          echo "Dossier source détecté : $OUT_DIR"
          
          # Fallback pour le routage SPA (cash, remerciements)
          cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"
          
          # Désactiver Jekyll pour conserver tous les fichiers générés
          touch "$OUT_DIR/.nojekyll"
          
          # Dossier unifié pour l'étape d'upload
          mkdir -p public_site
          cp -r "$OUT_DIR"/* public_site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

